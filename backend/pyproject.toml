[project]
name = "yzu-student-assistant-api"
version = "0.1.0"
description = "Local API for the YZU Student Assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "google-api-python-client==2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib==1.4.1",
    "httpx==0.28.1",
    "langchain-openai==1.6.2",
    "neo4j==6.3.0",
    "python-dotenv==1.2.3",
    "uvicorn==0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
